<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>অ্যাডমিন প্যানেল – PK Company Limited</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--tx:#14213d;--mu:#5b6b84;--pr:#0a7d5a;--pr2:#e3f5ee;--bd:#dde4ee;--err:#c0392b;--hd:#0b2a4a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--card:#17202f;--tx:#eaf0fa;--mu:#9fb0c9;--pr:#3ccf9d;--pr2:#12372d;--bd:#2a3750;--err:#ff7a6b;--hd:#0a1220}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali","Segoe UI",system-ui,sans-serif;line-height:1.55}
.top{background:var(--hd);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.w{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
input,select,button{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{cursor:pointer;background:var(--pr);color:#fff;border:0;font-weight:600}button.s{background:var(--pr2);color:var(--pr)}button.d{background:transparent;color:var(--err);padding:4px 8px}
.login{max-width:360px;margin:12vh auto}.login input{width:100%;margin:6px 0}.login button{width:100%;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stats div{background:var(--pr2);border-radius:12px;padding:12px;text-align:center}.stats b{display:block;font-size:1.5rem;color:var(--pr)}
.bar{display:flex;gap:8px;flex-wrap:wrap}.bar input{flex:1;min-width:180px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu)}tr.r{cursor:pointer}tr.r:hover{background:var(--pr2)}
.err{color:var(--err);font-size:.88rem;margin-top:6px}.hide{display:none}
#dt{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#dt>div{background:var(--card);border-radius:16px;padding:20px;max-width:480px;width:100%;max-height:85vh;overflow:auto}
#dt p{margin:6px 0}#dt span{color:var(--mu)}
</style>
</head>
<body>

<div id="lg" class="card login">
  <h2>🔐 অ্যাডমিন লগইন</h2>
  <input id="em" type="email" placeholder="ইমেইল" autocomplete="username">
  <input id="pw" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password">
  <button id="li">লগইন</button><div class="err" id="le"></div>
</div>

<div id="app" class="hide">
  <div class="top"><b>PK Company Limited – অ্যাডমিন</b><span><span id="who"></span> <button class="s" id="lo">লগআউট</button></span></div>
  <div class="w">
    <div class="card stats">
      <div><b id="s1">0</b>মোট</div><div><b id="s2">0</b>নতুন</div><div><b id="s3">0</b>যোগাযোগ হয়েছে</div>
      <div><b id="s4">0</b>পেমেন্ট হয়েছে</div><div><b id="s5">0</b>ভর্তি সম্পন্ন</div>
    </div>
    <div class="card">
      <div class="bar">
        <input id="q" placeholder="নাম, ফোন, জেলা বা ID দিয়ে খুঁজুন">
        <select id="fs"><option value="">সব স্ট্যাটাস</option><option>নতুন</option><option>যোগাযোগ হয়েছে</option><option>পেমেন্ট হয়েছে</option><option>ভর্তি সম্পন্ন</option></select>
        <select id="fp"><option value="">সব পেমেন্ট</option><option>পুরো ফি</option><option>EMI (কিস্তি)</option></select>
        <button class="s" id="csv">CSV ডাউনলোড</button>
      </div>
      <p class="err" id="ae"></p>
      <div class="sc"><table><thead><tr><th>তারিখ</th><th>ID</th><th>নাম</th><th>ফোন</th><th>জেলা</th><th>ব্যাচ</th><th>পেমেন্ট</th><th>স্ট্যাটাস</th></tr></thead><tbody id="tb"></tbody></table></div>
      <p class="hide" id="em0">কোনো রেজিস্ট্রেশন পাওয়া যায়নি।</p>
    </div>
  </div>
</div>

<div id="dt" class="hide"><div id="dc"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== Firebase Console > Project settings > Your apps > Config থেকে কপি করে বসান ===== */
const firebaseConfig={apiKey:"AIzaSyA5POzSzl_GxNOtT6G8R33o4fO7lZ8r4-4",authDomain:"pk-company-5a277.firebaseapp.com",projectId:"pk-company-5a277",storageBucket:"pk-company-5a277.firebasestorage.app",messagingSenderId:"487083193095",appId:"1:487083193095:web:78f3d755ade838d44ccba2"};
/* ======================================================================================= */
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
let ROWS=[],unsub=null;

$("li").onclick=async()=>{$("le").textContent="";try{await auth.signInWithEmailAndPassword($("em").value.trim(),$("pw").value)}catch(e){$("le").textContent="ইমেইল বা পাসওয়ার্ড ভুল"}};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("li").click()};
$("lo").onclick=()=>auth.signOut();
auth.onAuthStateChanged(u=>{
  if(!u){$("lg").classList.remove("hide");$("app").classList.add("hide");unsub&&unsub();return}
  $("lg").classList.add("hide");$("app").classList.remove("hide");$("who").textContent=u.email+" ";
  unsub=db.collection("registrations").orderBy("createdAt","desc").onSnapshot(s=>{ROWS=s.docs.map(d=>({_id:d.id,...d.data()}));$("ae").textContent="";draw()},
    e=>{$("ae").textContent="ডেটা পড়া যায়নি: এই অ্যাকাউন্টের অনুমতি নেই বা Firestore rules ঠিক নেই।"});
});

const bd=t=>t?new Date(t).toLocaleDateString("bn-BD",{day:"numeric",month:"short"}):"";
function view(){const q=$("q").value.trim().toLowerCase(),s=$("fs").value,p=$("fp").value;
return ROWS.filter(r=>(!s||(r.status||"নতুন")===s)&&(!p||r.pay===p)&&(!q||[r.name,r.phone,r.district,r.id,r.email].join(" ").toLowerCase().includes(q)))}
function draw(){const c=k=>ROWS.filter(r=>(r.status||"নতুন")===k).length;
$("s1").textContent=ROWS.length;$("s2").textContent=c("নতুন");$("s3").textContent=c("যোগাযোগ হয়েছে");$("s4").textContent=c("পেমেন্ট হয়েছে");$("s5").textContent=c("ভর্তি সম্পন্ন");
const v=view();$("em0").classList.toggle("hide",v.length>0);
$("tb").innerHTML=v.map(r=>`<tr class="r" data-i="${esc(r._id)}"><td>${bd(r.createdAt)}</td><td>${esc(r.id)}</td><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${esc(r.district)}</td><td>${esc(r.batch)}</td><td>${esc(r.pay)}</td><td>${esc(r.status||"নতুন")}</td></tr>`).join("")}
["q","fs","fp"].forEach(i=>$(i).oninput=draw);
$("tb").onclick=e=>{const t=e.target.closest("tr.r");if(t)open(t.dataset.i)};

function open(id){const r=ROWS.find(x=>x._id===id);if(!r)return;const st=r.status||"নতুন";
$("dc").innerHTML=`<h3>${esc(r.name)} <span>(${esc(r.id)})</span></h3>
<p><span>ফোন:</span> <a href="tel:${esc(r.phone)}">${esc(r.phone)}</a> · <a href="https://wa.me/88${esc(r.phone)}" target="_blank" rel="noopener">WhatsApp</a></p>
<p><span>ইমেইল:</span> ${esc(r.email)||"-"}</p><p><span>বয়স / জেলা:</span> ${esc(r.age)||"-"} / ${esc(r.district)}</p>
<p><span>পরিচয়:</span> ${esc(r.role)} ${r.org?"· "+esc(r.org):""}</p><p><span>অভিজ্ঞতা:</span> ${esc(r.level)||"-"}</p>
<p><span>লক্ষ্য:</span> ${esc((r.goals||[]).join(", "))||"-"}</p><p><span>ব্যাচ / পেমেন্ট:</span> ${esc(r.batch)} / ${esc(r.pay)}</p>
<p><span>সোর্স / রেফারেল:</span> ${esc(r.source)||"-"} / ${esc(r.referral)||"-"}</p><p><span>মন্তব্য:</span> ${esc(r.message)||"-"}</p>
<p><span>স্ট্যাটাস:</span> <select id="ss">${["নতুন","যোগাযোগ হয়েছে","পেমেন্ট হয়েছে","ভর্তি সম্পন্ন"].map(o=>`<option${o===st?" selected":""}>${o}</option>`).join("")}</select></p>
<p><span>অ্যাডমিন নোট:</span><br><input id="nt" style="width:100%" value="${esc(r.note||"")}"></p>
<p><button id="sv">সংরক্ষণ</button> <button class="s" id="cl">বন্ধ করুন</button> <button class="d" id="dl">মুছুন</button></p>`;
$("dt").classList.remove("hide");
$("cl").onclick=()=>$("dt").classList.add("hide");
$("sv").onclick=async()=>{try{await db.collection("registrations").doc(id).update({status:$("ss").value,note:$("nt").value.trim()});$("dt").classList.add("hide")}catch(e){alert("সংরক্ষণ ব্যর্থ হয়েছে")}};
$("dl").onclick=async()=>{if(!confirm("এই রেজিস্ট্রেশন স্থায়ীভাবে মুছে ফেলবেন?"))return;try{await db.collection("registrations").doc(id).delete();$("dt").classList.add("hide")}catch(e){alert("মোছা যায়নি")}}}
$("dt").onclick=e=>{if(e.target===$("dt"))$("dt").classList.add("hide")};

$("csv").onclick=()=>{const h=["id","name","phone","email","age","district","role","org","level","goals","batch","pay","source","referral","message","status","note","createdAt"];
const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
const t="\ufeff"+[h.join(",")].concat(view().map(r=>h.map(k=>q(Array.isArray(r[k])?r[k].join("; "):r[k])).join(","))).join("\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download="registrations.csv";a.click()};
</script>
</body>
</html>
